<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Код подключения Threads</title>
<style>
  :root { --bg: #f6f6f4; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --accent: #1d1d1b; --accent-text: #ffffff; --border: #e3e3de; --ok: #1f7a4d; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151514; --card: #1f1f1d; --text: #ececea; --muted: #a3a39e; --accent: #ececea; --accent-text: #151514; --border: #33332f; --ok: #5cc490; --err: #f2867d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 16px; }
  main { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 28px 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .code { font: 15px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; background: var(--bg);
          border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 0 0 16px; color: var(--text); user-select: all; }
  button { width: 100%; font: inherit; font-weight: 600; padding: 14px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-text); cursor: pointer; }
  .status { margin: 12px 0 0; min-height: 1.5em; font-weight: 600; color: var(--ok); }
  .error { color: var(--err); }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <section id="ok" class="hidden">
    <h1>Threads подключается ✅</h1>
    <p>Скопируйте код и отправьте его тому, кто настраивает автопостер. Код одноразовый и действует 1 час.</p>
    <div id="code" class="code"></div>
    <button id="copy" type="button">Скопировать код</button>
    <p id="status" class="status" aria-live="polite"></p>
  </section>
  <section id="fail" class="hidden">
    <h1 class="error">Не получилось</h1>
    <p id="reason"></p>
  </section>
  <section id="empty" class="hidden">
    <h1>Страница подключения Threads</h1>
    <p>Сюда Threads перенаправляет после входа. Откройте ссылку подключения, которую вам прислали, — код появится здесь.</p>
  </section>
</main>
<script>
  // Страница ничего никуда не отправляет: только показывает код из адресной строки.
  (function () {
    var params = new URLSearchParams(window.location.search);
    var code = (params.get("code") || "").replace(/#_$/, "");
    var error = params.get("error_description") || params.get("error_reason") || params.get("error");
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    if (code) {
      document.getElementById("code").textContent = code;
      show("ok");
      document.getElementById("copy").addEventListener("click", function () {
        var status = document.getElementById("status");
        var done = function () { status.textContent = "Скопировано"; };
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(code).then(done, function () { status.textContent = "Выделите код и скопируйте вручную"; });
        } else {
          var range = document.createRange();
          range.selectNodeContents(document.getElementById("code"));
          var sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(range);
          status.textContent = document.execCommand("copy") ? "Скопировано" : "Выделите код и скопируйте вручную";
        }
      });
      // убираем код из истории браузера
      if (window.history && history.replaceState) { history.replaceState(null, "", window.location.pathname); }
    } else if (error) {
      document.getElementById("reason").textContent = error.replace(/\+/g, " ");
      show("fail");
    } else {
      show("empty");
    }
  })();
</script>
</body>
</html>
